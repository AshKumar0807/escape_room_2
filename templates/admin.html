{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-4 text-center">Admin Dashboard</h2>

<div class="mb-4 flex space-x-4">
    <a href="{{ url_for('add_page') }}" class="btn">Add New Page</a>
    <a href="{{ url_for('manage_pages') }}" class="btn">Manage Pages</a>
</div>

<table class="w-full border border-yellow-600 rounded">
    <thead>
        <tr class="bg-gray-800 text-yellow-400">
            <th class="p-2 border-b border-yellow-600">Team</th>
            <th class="p-2 border-b border-yellow-600">Last Key</th>
            <th class="p-2 border-b border-yellow-600">Current Page</th>
            <th class="p-2 border-b border-yellow-600">Unlocked Pages</th>
        </tr>
    </thead>
    <tbody>
        {% for team in progress_data %}
        <tr class="border-b border-yellow-600">
            <td class="p-2">{{ team.name }}</td>
            <td class="p-2">{{ team.last_key or "-" }}</td>
            <td class="p-2">{{ team.current_page }}</td>
            <td class="p-2">{{ team.unlocked_pages | join(", ") }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
