{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-gray-900 p-6 rounded shadow-lg border-2 border-yellow-500">
    <h2 class="text-2xl font-bold text-yellow-400 mb-6 text-center">Team Login</h2>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-yellow-300 mb-1">Team Name:</label>
            <input type="text" name="team_name" required
                class="w-full px-3 py-2 rounded bg-gray-800 text-yellow-200 focus:outline-none focus:ring-2 focus:ring-yellow-500">
        </div>
        <div>
            <label class="block text-yellow-300 mb-1">Password:</label>
            <input type="password" name="password" required
                class="w-full px-3 py-2 rounded bg-gray-800 text-yellow-200 focus:outline-none focus:ring-2 focus:ring-yellow-500">
        </div>
        <button type="submit"
            class="w-full py-2 bg-yellow-500 text-gray-900 font-bold rounded hover:bg-yellow-400 transition">
            Login
        </button>
    </form>
    <p class="mt-4 text-yellow-300 text-sm text-center">
        New team? <a href="{{ url_for('signup') }}" class="text-yellow-500 underline">Sign up here</a>
    </p>
</div>
{% endblock %}
