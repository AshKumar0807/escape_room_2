{% extends "base.html" %}
{% block content %}
<div class="mb-4 flex space-x-4">
    <a href="{{ url_for('admin') }}" class="btn">Dashboard</a>
</div>
<h2 class="text-2xl font-bold mb-4">Manage Pages</h2>

<a href="{{ url_for('add_page') }}" class="btn mb-4 inline-block">Add New Page</a>

<table class="w-full border border-yellow-600 rounded">
    <thead>
        <tr class="bg-gray-800 text-yellow-400">
            <th class="p-2 border-b border-yellow-600">ID</th>
            <th class="p-2 border-b border-yellow-600">Title</th>
            <th class="p-2 border-b border-yellow-600">Question</th>
            <th class="p-2 border-b border-yellow-600">Answer</th>
            <th class="p-2 border-b border-yellow-600">Unlock Code</th>
            <th class="p-2 border-b border-yellow-600">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for page in pages %}
        <tr class="border-b border-yellow-600">
            <td class="p-2">{{ page.id }}</td>
            <td class="p-2">{{ page.title }}</td>
            <td class="p-2">{{ page.question }}</td>
            <td class="p-2">{{ page.answer }}</td>
            <td class="p-2">{{ page.unlock_code }}</td>
            <td class="p-2">
                <a href="{{ url_for('edit_page', page_id=page.id) }}" class="btn">Edit</a>
                <a href="{{ url_for('delete_page', page_id=page.id) }}"
                    class="btn bg-red-600 hover:bg-red-700">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
