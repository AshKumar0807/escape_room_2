{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Leaderboard</h2>
<table class="w-full border border-yellow-600 rounded">
    <thead>
        <tr class="bg-gray-800 text-yellow-400">
            <th class="p-2 border-b border-yellow-600">#</th>
            <th class="p-2 border-b border-yellow-600">Team Name</th>
            <th class="p-2 border-b border-yellow-600">Pages Unlocked</th>
            <th class="p-2 border-b border-yellow-600">Current Page</th>
        </tr>
    </thead>
    <tbody>
        {% for team in leaderboard%}
        <tr class="border-b border-yellow-600">
            <td class="p-2">{{ team.id }}</td>
            <td class="p-2">{{ team.team_name }}</td>
            <td class="p-2">{{ team.pages_unlocked }}</td>
            <td class="p-2">{{ team.current_page }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
