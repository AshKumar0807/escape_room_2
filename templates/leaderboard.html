<table class="w-full table-auto border-collapse border border-yellow-600 rounded">
    <thead>
        <tr class="bg-gray-800 text-yellow-400">
            <th class="p-2 border-b border-yellow-600 text-left">#</th>
            <th class="p-2 border-b border-yellow-600 text-left">Team Name</th>
            <th class="p-2 border-b border-yellow-600 text-center">Pages Unlocked</th>
            <th class="p-2 border-b border-yellow-600 text-center">Current Page</th>
        </tr>
    </thead>
    <tbody>
        {% for team in leaderboard %}
        <tr class="border-b border-yellow-600">
            <td class="p-2 text-left">{{ loop.index }}</td>
            <td class="p-2 text-left">{{ team.team_name }}</td>
            <td class="p-2 text-center">{{ team.pages_unlocked }}</td>
            <td class="p-2 text-center">{{ team.current_page }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
